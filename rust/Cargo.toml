[package]
name = "treeflat"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Exact evaluator of xgboost, LightGBM and YDF forests compiled to one flat file"
license = "MIT"
publish = false

[lib]
name = "treeflat"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
